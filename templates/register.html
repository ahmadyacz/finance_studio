{% extends "layout.html" %}

{% block title %}Register · Finance Studio{% endblock %}

{% block content %}
<section class="narrow stack animate-in">

    <div class="stack stack--tight">
        <h1 class="h1">Hello!</h1>
        <p class="text text-muted">Tell us your name and how much cash you're starting with. You can add more any time.</p>
    </div>

    <form class="card form" action="/register" method="post">

        <div class="field">
            <label class="label" for="name">Your name</label>
            <input class="input" type="text" id="name" name="name"
                   placeholder="Your name" autocomplete="given-name" autofocus required>
        </div>

        <div class="field">
            <label class="label" for="amount">Your first amount</label>
            <div class="input-group">
                <span class="input-group__prefix">{{ currency|default('DZ') }}</span>
                <input class="input-group__input" type="number" id="amount" name="amount"
                       placeholder="0.00" step="0.01" min="0" inputmode="decimal" required>
            </div>
            <p class="field__hint">This becomes your current cash.</p>
        </div>

        <button class="btn btn-primary btn-lg btn-block" type="submit">Register</button>
    </form>

</section>
{% endblock %}
